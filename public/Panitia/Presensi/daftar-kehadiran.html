<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Presensi Pemira 2025</title>
  <link rel="shortcut icon" href="/img/logo.webp" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer type="module" src="daftar.js"></script>
  <style>
    @font-face {
    font-family: 'Upheaval';
    src: url('/upheavtt.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
      }
   .font-custom {
    font-family: 'Upheaval', sans-serif!important;
   }
   th {
    font-family: "Poppins", serif!important;

}
   tr {
    font-family: "Poppins", serif!important;

}
      #content {
      display: none; /* Default hidden */
    }
  </style>
</head>
<body class="bg-[url('/img/pixel.jpg')] bg-cover bg-no-repeat object-cover flex items-center justify-center py-32">
  <div class="container mx-auto">
    <h1 class="text-2xl font-custom text-yellow-500 font-normal text-center mb-6">Daftar Presensi Pemira 2025</h1>
    <div class="bg-white overflow-auto rounded-lg">
        <table class="min-w-full bg-white">
            <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="px-4 py-2 text-center border-b">Waktu</th>
                    <th class="px-4 py-2 text-center border-b">Nama</th>
                    <th class="px-4 py-2 text-center border-b">NIM</th>
                    <th class="px-4 py-2 text-center border-b">Prodi</th>
                    <th class="px-4 py-2 text-center border-b">Semester</th>
                    <th class="px-4 py-2 text-center border-b">Status</th>
                  </tr>
            </thead>
            <tbody id="daftar-presensi" class="text-gray-700">
            </tbody>
        </table>
    </div>
  </div>
</body>
</html>
